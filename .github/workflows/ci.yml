name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: Lint, type check, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/aas_test
      # Test-only credentials for a throwaway CI database.
      DATABASE_URL_APP: postgres://aas_app:ci-app-password@localhost:5432/aas_test
      DATABASE_URL_PLATFORM: postgres://aas_platform:ci-platform-password@localhost:5432/aas_test
      ROOT_DOMAIN: localhost
      # Test-only key (all 7s) for the throwaway CI database.
      MFA_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests (unit and company data separation)
        run: npm test
      - run: npm run build
