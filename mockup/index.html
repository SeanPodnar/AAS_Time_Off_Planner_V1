<style>
/* Layout: app shell. Slim brand top bar, left nav (tabs on phones), work area of cards and tables. Light sky-blue identity, per-company brand colour drives --brand. */
:root{

  --brand-ink:#ffffff;
  --brand-tint:color-mix(in oklab,var(--brand) 11%,var(--surface));
  --brand-soft:color-mix(in oklab,var(--brand) 22%,var(--surface));
  --brand-strong:color-mix(in oklab,var(--brand) 82%,#000);
  --font-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Sora","Figtree",system-ui,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1621; --surface:#152030; --surface-2:#1b2940; --ink:#e4ecf6; --muted:#9aabc0; --line:#27364c;
  --ok:#4cc28d; --warn:#e7a43c; --bad:#ef7486; --info:#6eb0f5;
  --ok-bg:#17352a; --warn-bg:#3a2c12; --bad-bg:#3d1c24;
  --c-vac:#3cc0ae; --c-well:#a68cf0; --c-sick:#ec8098; --c-pers:#e6aa45; --c-unp:#8d9cb0; --c-ooo:#7b8aa0;
  --brand-strong:color-mix(in oklab,var(--brand) 70%,#fff);
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1621; --surface:#152030; --surface-2:#1b2940; --ink:#e4ecf6; --muted:#9aabc0; --line:#27364c;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const D = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const iso = dt => dt.toISOString().slice(0,10);
const addDays = (s,n) => { const d = D(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = s => { if(!s) return ""; const d = D(s); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const fmtShort = s => { const d = D(s); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const range = (a,b) => a===b ? fmt(a) : (a.slice(0,4)===b.slice(0,4) ? `${fmtShort(a)} to ${fmt(b)}` : `${fmt(a)} to ${fmt(b)}`);
const dow = s => D(s).getUTCDay();
const r05 = n => Math.round(n*2)/2;
const r025 = n => Math.round(n*4)/4;
const num = (n,unit) => { const v = Number.isInteger(n) ? n : n.toFixed(unit==="hours"?2:1).replace(/\.?0+$/,""); return v; };
const initials = n => n.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const yearsOfService = (hire, at=TODAY) => { const h=D(hire), a=D(at); let y=a.getUTCFullYear()-h.getUTCFullYear(); if (a.getUTCMonth()<h.getUTCMonth() || (a.getUTCMonth()===h.getUTCMonth() && a.getUTCDate()<h.getUTCDate())) y--; return Math.max(0,y); };
let uid = 100; const nid = p => p + (++uid);

/* ---------- statutory sample table (to be verified before launch) ---------- */
const JUR = {
  ON:{name:"Ontario",country:"CA"}, BC:{name:"British Columbia",country:"CA"}, AB:{name:"Alberta",country:"CA"},

  CA:{name:"California",country:"US",noForfeit:true}, NY:{name:"New York",country:"US"}, TX:{name:"Texas",country:"US"},
  CO:{name:"Colorado",country:"US",noForfeit:true}, IL:{name:"Illinois",country:"US",conditional:true}
};
function statMinVacation(j, yrs){
  switch(j){
    case "ON": case "BC": case "AB": return yrs>=5?15:10;
    case "QC": return yrs>=10?20:yrs>=3?15:10;
    case "SK": return yrs>=10?20:15;
    case "NS": return yrs>=8?15:10;
    default: return 0;
  }
}
function nextStatStep(j, hire){
  const steps = {ON:[5],BC:[5],AB:[5],QC:[3,10],SK:[10],NS:[8]}[j] || [];
  const yrs = yearsOfService(hire);
  const s = steps.find(x => x > yrs);
  if (!s) return null;
  const h = D(hire); const at = `${h.getUTCFullYear()+s}-${hire.slice(5)}`;
  return {years:s, date:at, min:statMinVacation(j,s)};
}

/* ---------- engine ---------- */
function isHoliday(t,s){ return t.holidays.find(h=>h[0]===s); }
function workingDays(t,s,e,hs,he){
  if (!s || !e || e < s) return 0;
  let n = 0;
  for (let d=s; d<=e; d=addDays(d,1)){ const w=dow(d); if (w===0||w===6||isHoliday(t,d)) continue; n++; }
  if (n===0) return 0;
  if (s===e){ return (hs||he) ? 0.5 : n; }
  if (hs && !(dow(s)%6===0||isHoliday(t,s))) n -= .5;
  if (he && !(dow(e)%6===0||isHoliday(t,e))) n -= .5;
  return n;
}
function isWork(t,d){ const w=dow(d); return !(w===0||w===6||isHoliday(t,d)); }
function nextWork(t,d){ let x=addDays(d,1); while(!isWork(t,x)) x=addDays(x,1); return x; }
function prevWork(t,d){ let x=addDays(d,-1); while(!isWork(t,x)) x=addDays(x,-1); return x; }
/* Running total for escalation: this request plus any of the person's live bookings (any plan) that touch it with no working day in between. */
function contiguous(t,r){
  const others = t.requests.filter(x=>Array.isArray(x)?false:(x.pid===r.pid && x.id!==r.id && x.id!==r.replaces && !["denied","cancelled"].includes(x.status)));
  let a=r.start, b=r.end, members=[], grew=true;
  while (grew){ grew=false; for (const x of others){ if (members.includes(x)) continue; if (x.start<=nextWork(t,b) && x.end>=prevWork(t,a)){ members.push(x); if (x.start<a) a=x.start; if (x.end>b) b=x.end; grew=true; } } }
  return {days: r.days + members.reduce((n,x)=>n+x.days,0), start:a, end:b, members};
}
function buildSteps(t,r){
  const plan = t.plans.find(p=>p.id===r.plan), person = t.people.find(p=>p.id===r.pid);
  const steps = [];
  if (plan.approval==="auto") return steps;
  const adminId = t.personas.admin;
  if (plan.approval==="admin" || !person.mgr) steps.push({who:"admin",pid:adminId,status:"pending"});
  else steps.push({who:"manager",pid:person.mgr,status:"pending"});
  if (plan.escalate && contiguous(t,r).days > t.escalationDays){
    let second;
    if (plan.escalate==="next"){ const m = t.people.find(p=>p.id===person.mgr); second = m && m.mgr ? {who:"next",pid:m.mgr} : {who:"admin",pid:adminId}; }
    else second = {who:"admin",pid:adminId};
    if (second.pid !== steps[0].pid) steps.push({...second,status:"waiting"});
  }
  return steps;
}
function entitlement(t,person,plan){
  const a = person.assign[plan.id]; if (!a) return null;
  const lvl = plan.levels.find(l=>l.id===(a.level||plan.levels[0].id));
  const annual = lvl.days;
  const hireYr = Number(person.hire.slice(0,4));
  const startMonth = hireYr===YEAR ? Number(person.hire.slice(5,7)) - (Number(person.hire.slice(8,10))<=15?1:0) : 0; // months before hire not earned
  const monthsInYear = 12 - startMonth;
  const nowMonth = Number(TODAY.slice(5,7));
  let accrued;
  if (plan.freq==="monthly") accrued = annual * Math.max(0, nowMonth - startMonth) / 12;
  else if (plan.freq==="quarterly"){ const q = Math.ceil(nowMonth/3); const startQ = Math.floor(startMonth/3); accrued = annual * Math.max(0,q-startQ)/4; }
  else accrued = annual * monthsInYear/12;
  const yearFull = annual * monthsInYear/12;
  return {level:lvl, annual, accrued:r05(accrued), yearFull:r05(yearFull), carry:a.carry||0};
}
function sickHours(person){
  const hire = person.hire > `${YEAR}-01-01` ? person.hire : `${YEAR}-01-01`;
  const weeks = (D(TODAY)-D(hire))/(7*864e5);
  return Math.min(80, r025(weeks*40/30));
}
function balance(t,pid,planId){
  const person = t.people.find(p=>p.id===pid), plan = t.plans.find(p=>p.id===planId);
  const hpd = t.hoursPerDay;
  const unit = plan.unit;
  const conv = d => unit==="hours" ? d*hpd : d;
  const rs = t.requests.filter(r=>r.pid===pid && r.plan===planId && r.start.slice(0,4)==String(YEAR));
  const taken = rs.filter(r=>["approved","change-pending","cancel-pending"].includes(r.status) && r.start<=TODAY).reduce((a,r)=>a+conv(r.days),0);
  const booked = rs.filter(r=>["approved","change-pending","cancel-pending"].includes(r.status) && r.start>TODAY).reduce((a,r)=>a+conv(r.days),0);
  const pending = rs.filter(r=>r.status==="pending").reduce((a,r)=>a+conv(r.days),0);
  const adj = t.adjust.filter(a=>a.pid===pid && a.plan===planId).reduce((a,x)=>a+x.amount,0);
  if (plan.tracked) return {unit,tracked:true,taken,booked,pending};
  let accrued, yearFull, carry=0, level=null, annual=0;
  if (unit==="hours"){ accrued = sickHours(person); yearFull = 80; level={name:"Accrues by hours worked"}; }
  else { const e = entitlement(t,person,plan); accrued=e.accrued; yearFull=e.yearFull; carry=e.carry; level=e.level; annual=e.annual; }
  const available = accrued + carry + adj - taken - booked - pending;
  const projected = yearFull + carry + adj - taken - booked - pending;
  return {unit,level,annual,accrued,yearFull,carry,adj,taken,booked,pending,available,projected};
}
function unitLabel(u,n){ return u==="hours" ? "hours" : (n===1?"day":"days"); }
function canSeeType(viewer, person, plan){
  if (S.role==="admin" || S.role==="platform") return true;
  if (viewer.id===person.id) return true;
  if (S.role==="manager" && (person.mgr===viewer.id)) return true;
  return plan.visibility==="name";
}
function pendingFor(pid, adminView){
  return T().requests.filter(r => {
    const st = r.steps.find(s=>s.status==="pending");
    if (!st || !["pending","change-pending","cancel-pending"].includes(r.status)) return false;
    return adminView ? true : st.pid===pid;
  });
}

function hexToRgb(h){ const m = h.replace("#",""); return [0,2,4].map(i=>parseInt(m.slice(i,i+2),16)); }
function lum(h){ return hexToRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0); }
function contrast(a,b){ const [x,y]=[lum(a),lum(b)].sort((m,n)=>n-m); return (x+.05)/(y+.05); }

function adjustModalHtml(){
  const m=S.modal, t=T(), p=P(m.pid); const f=m.form;
  return `<div class="overlay" data-act="closeBg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="cardhead"><h2 id="mt">Adjust balance for ${esc(p.name)}</h2><button class="btn ghost sm" data-act="close">Close</button></div>
  <div class="fgrid"><div class="field"><label for="aPlan">Plan</label><select id="aPlan">${t.plans.filter(pl=>p.assign[pl.id]&&!pl.tracked).map(pl=>`<option value="${pl.id}" ${pl.id===f.plan?"selected":""}>${esc(pl.name)}</option>`).join("")}</select></div>
  <div class="field"><label for="aAmt">Amount (+ adds, - removes)</label><input type="number" id="aAmt" step="0.5" value="${f.amount}"></div>
  <div class="field"><label for="aDate">Effective date</label><input type="date" id="aDate" value="${f.date}"></div>
  <div class="field" style="grid-column:1/-1"><label for="aReason">Reason (required, logged)</label><input type="text" id="aReason" value="${esc(f.reason)}" placeholder="For example: bonus wellbeing day for project launch"></div></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="submitAdj" ${!f.reason.trim()||!Number(f.amount)?"disabled":""}>Save adjustment</button></div></div></div>`;
}
function renderModal(){
  const L=document.getElementById("layer"); if(!S.modal){L.innerHTML="";return;}
  const ae=document.activeElement, focusId=ae?.id, sel=ae?.selectionStart;
  L.innerHTML = S.modal.type==="req" ? reqModalHtml() : adjustModalHtml();
  const el = focusId && document.getElementById(focusId);
  if (el){ el.focus(); try{ if (sel!=null) el.setSelectionRange(sel,sel); }catch(e){} } else L.querySelector("select,input")?.focus();
}

/* ---------- render ---------- */
function render(){
  applyBrand(); renderTop(); renderNav();
  const v = {home:viewHome,team:viewTeam,approvals:viewApprovals,calendar:viewCalendar,sync:viewSync,people:viewPeople,plans:viewPlans,reports:viewReports,integrations:viewIntegrations,branding:viewBranding,audit:viewAudit,tenants:viewTenants}[S.view] || viewHome;
  const focusId=document.activeElement?.id, selStart=document.activeElement?.selectionStart;
  document.getElementById("main").innerHTML = v();
  if (focusId && !S.modal){ const el=document.getElementById(focusId); if (el){ el.focus(); try{ if (selStart!=null) el.setSelectionRange(selStart,selStart);}catch(e){} } }
  renderModal();
}
let toastTimer;
function toast(msg){ let el=document.querySelector(".toast"); if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);} el.textContent=msg; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.remove(),3200); }

/* ---------- actions ---------- */
function newReqModal(pid, onBehalf, editing){
  const t=T(), p=P(pid);
  let form;
  if (editing){ const r=t.requests.find(x=>x.id===editing); form={plan:r.plan,start:r.start,end:r.end,halfStart:r.halfStart,halfEnd:r.halfEnd,comment:r.comment,reason:"",autoApprove:true}; }
  else { const s="2026-11-16"; form={plan:t.plans.find(pl=>p.assign[pl.id]).id,start:s,end:"2026-11-18",halfStart:false,halfEnd:false,comment:"",reason:"",autoApprove:true}; }
  openModal({type:"req",pid,onBehalf,editing,form});
}
function submitReq(){
  const t=T(), m=S.modal, f=m.form, person=P(m.pid);
  const days=workingDays(t,f.start,f.end,f.halfStart,f.halfEnd);
  const pl=PL(f.plan);
  if (m.editing){
    const r=t.requests.find(x=>x.id===m.editing);
    if (r.status==="approved" && !m.onBehalf){
      r.change={plan:f.plan,start:f.start,end:f.end,halfStart:f.halfStart,halfEnd:f.halfEnd,days,comment:f.comment};
      r.status="change-pending"; r.steps=buildSteps(t,{pid:r.pid,plan:f.plan,days,start:f.start,end:f.end,id:"chg",replaces:r.id});
      if (!r.steps.length){ Object.assign(r,r.change); delete r.change; r.status="approved"; toast("Change applied. This plan approves automatically."); }
      else toast(`Change sent to ${P(r.steps[0].pid).name}. Your original dates stay booked until it's approved.`);
      log(`${person.name}: changed ${pl.name} ${range(f.start,f.end)} (was ${range(r.start,r.end)}).`);
    } else {
      Object.assign(r,{plan:f.plan,start:f.start,end:f.end,halfStart:f.halfStart,halfEnd:f.halfEnd,days,comment:f.comment});
      if (m.onBehalf){ r.status="approved"; r.steps.forEach(s=>s.status="approved"); log(`Amended ${person.name}'s ${pl.name} to ${range(f.start,f.end)}. Reason: ${f.reason}`); }
      else { r.steps=buildSteps(t,r); if(!r.steps.length) r.status="approved"; log(`${person.name}: edited pending request ${range(f.start,f.end)}.`); }
      toast("Request updated.");
    }
  } else {
    const r={id:nid("r"),pid:person.id,plan:f.plan,start:f.start,end:f.end,halfStart:f.halfStart,halfEnd:f.halfEnd,days,comment:f.comment,status:"pending",kind:"new",created:TODAY};
    r.steps = m.onBehalf&&f.autoApprove ? [] : buildSteps(t,r);
    if (!r.steps.length) r.status="approved";
    t.requests.push(r);
    if (m.onBehalf) log(`Added ${pl.name} for ${person.name}, ${range(f.start,f.end)}. Reason: ${f.reason}`);
    else log(`${person.name}: requested ${pl.name}, ${range(f.start,f.end)}.`);
    toast(r.status==="approved" ? `${pl.name} booked: ${range(f.start,f.end)}.` : `Request sent to ${P(r.steps[0].pid).name}. Switch to ${r.steps[0].who==="admin"?"HR admin":"Manager"} view to approve it.`);
  }
  closeModal(); render();
}
function decide(id, d){
  const t=T(), r=t.requests.find(x=>x.id===id); const cm=document.getElementById("cm-"+id)?.value.trim()||"";
  if (d==="deny" && !cm){ toast("Add a comment so the employee knows why."); document.getElementById("cm-"+id)?.focus(); return; }
  const pe=P(r.pid), pl=PL(r.plan), actor=S.platformVisit?"Platform owner":me().name;
  const i=r.steps.findIndex(s=>s.status==="pending");
  if (d==="deny"){
    if (r.status==="change-pending"){ delete r.change; r.status="approved"; r.steps.forEach(s=>s.status="approved"); toast("Change declined. The original dates stay booked."); }
    else if (r.status==="cancel-pending"){ r.status="approved"; r.steps.forEach(s=>s.status="approved"); toast("Cancellation declined."); }
    else { r.status="denied"; toast(`Declined. ${pe.name} is notified with your comment.`); }
    r.comment = r.comment ? `${r.comment} · Approver: ${cm}` : `Approver: ${cm}`;
    log(`${actor} declined ${pe.name}'s ${pl.name} (${range(r.start,r.end)}). Comment: ${cm}`);
  } else {
    r.steps[i].status="approved";
    if (r.steps[i+1]){ r.steps[i+1].status="pending"; toast(`Approved. ${P(r.steps[i+1].pid).name} is notified for the second approval.`); log(`${actor} approved step ${i+1} for ${pe.name}'s ${pl.name}.`); }
    else {
      if (r.status==="change-pending"){ Object.assign(r,r.change); delete r.change; r.status="approved"; }
      else if (r.status==="cancel-pending"){ r.status="cancelled"; }
      else r.status="approved";
      toast(`Done. ${pe.name}'s calendar feed and balance are updated.`);
      log(`${actor} approved ${pe.name}'s ${pl.name} (${range(r.start,r.end)}).`);
    }
  }
  render();
}
function cancelReq(id){
  const t=T(), r=t.requests.find(x=>x.id===id), pl=PL(r.plan), p=P(r.pid);
  if (r.status==="pending" || S.role==="admin"){ r.status="cancelled"; log(`${S.role==="admin"?"HR cancelled":"Cancelled"} ${p.name}'s ${pl.name} ${range(r.start,r.end)}.`); toast("Cancelled. The days are back in the balance."); }
  else if (pl.cancelApproval){ r.status="cancel-pending"; r.steps=buildSteps(t,r); if(!r.steps.length){r.status="cancelled";} else toast(`Cancellation sent to ${P(r.steps[0].pid).name} for approval.`); log(`${p.name} asked to cancel ${pl.name} ${range(r.start,r.end)}.`); }
  else { r.status="cancelled"; toast("Cancelled."); }
  render();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a=el.dataset.act, v=el.dataset.v;
  if (a==="closeBg"){ if (e.target===el) closeModal(); return; }
  if (el.tagName==="INPUT" || el.tagName==="SELECT") return;
  switch(a){
    case "role":
      S.platformVisit=false;
      if (v==="platform"){ S.role="platform"; S.view="tenants"; }
      else { S.role=v; S.view={employee:"home",manager:"team",admin:"people"}[v]; }
      S.report=null; break;
    case "tenant": S.tenant=v; S.selPerson=null; S.selPlan=null; S.report=null; S.filters={}; break;
    case "view": S.view=v; S.report=null; break;
    case "enter": S.tenant=v; S.role="admin"; S.platformVisit=true; S.view="people"; S.selPerson=null; S.selPlan=null; log("Platform owner opened the company console."); break;
    case "exitVisit": S.platformVisit=false; S.role="platform"; S.view="tenants"; break;
    case "newReq": newReqModal(el.dataset.for||me().id, !!el.dataset.for); return;
    case "amend": { const r=T().requests.find(x=>x.id===v); newReqModal(r.pid, S.role==="admin", v); return; }
    case "cancelReq": cancelReq(v); return;
    case "close": closeModal(); return;
    case "submitReq": submitReq(); return;
    case "decide": decide(v, el.dataset.d); return;
    case "calScope": S.calScope=v; break;
    case "cal": S.calMonth=v; break;
    case "copy": { const inp=document.getElementById(v); navigator.clipboard?.writeText(inp.value).then(()=>toast("Link copied."),()=>{inp.select();toast("Press Ctrl+C or Cmd+C to copy.");}); return; }
    case "toast": toast(v); return;
    case "selPerson": S.selPerson=v; break;
    case "selPlan": S.selPlan=v; break;
    case "adjust": openModal({type:"adj",pid:v,form:{plan:"vac",amount:1,date:TODAY,reason:""}}); return;
    case "submitAdj": { const m=S.modal, f=m.form; T().adjust.push({pid:m.pid,plan:f.plan,amount:Number(f.amount),date:f.date,reason:f.reason}); log(`Adjusted ${P(m.pid).name}'s ${PL(f.plan).name} by ${f.amount>0?"+":""}${f.amount}. Reason: ${f.reason}`); closeModal(); toast("Balance adjusted and logged."); break; }
    case "openReport": S.report=v||null; S.filters={...S.filters,rQ:"",rLoc:"",rPlan:""}; if(v) log(`Opened report: ${REPORTS.find(r=>r.id===v).name}.`); break;
    case "sort": { const cur=S.sort[el.dataset.rep]; S.sort[el.dataset.rep]={k:v,dir:cur&&cur.k===v?-cur.dir:1}; break; }
    case "brand": T().brand=v; log(`Brand colour changed to ${v}.`); break;
    case "clearLogo": T().logo=null; log("Logo removed."); break;
    default: return;
  }
  render();
});
document.addEventListener("input", e => {
  const el=e.target, id=el.id;
  if (S.modal && S.modal.type==="req"){
    const f=S.modal.form;
    const map={fPlan:"plan",fStart:"start",fEnd:"end",fComment:"comment",fReason:"reason"};
    if (map[id]){ f[map[id]]=el.value; if (id==="fStart" && (!f.end || f.end<f.start)) f.end=f.start; if (f.start===f.end) f.halfEnd=false; if (id!=="fComment") renderModal(); return; }
    if (id==="fHs"){ f.halfStart=el.value==="1"; renderModal(); return; }
    if (id==="fHe"){ f.halfEnd=el.value==="1"; renderModal(); return; }
    if (id==="fAuto"){ f.autoApprove=el.checked; renderModal(); return; }
  }
  if (S.modal && S.modal.type==="adj"){
    const f=S.modal.form; const map={aPlan:"plan",aAmt:"amount",aDate:"date",aReason:"reason"};
    if (map[id]){ f[map[id]]=el.value; renderModal(); return; }
  }
  if (id==="peopleQ"){ S.filters.peopleQ=el.value; render(); return; }
  if (["rQ","rLoc","rPlan","whoFrom","whoTo"].includes(id)){ S.filters[id]=el.value; render(); return; }
  if (el.dataset.act==="levelDays"){ const pl=PL(el.dataset.plan); const l=pl.levels.find(x=>x.id===el.dataset.v); l.days=Number(el.value)||0; render(); return; }
  if (el.dataset.act==="carry"){ PL(el.dataset.plan).carry=el.value; render(); return; }
  if (el.dataset.act==="esc"){ PL(el.dataset.plan).escalate=el.value||null; log(`Second approval for ${PL(el.dataset.plan).name} set to ${el.value||"off"}.`); render(); return; }
});
document.addEventListener("change", e => {
  if (e.target.id==="logoFile"){ const file=e.target.files[0]; if(!file) return; if (file.size>1.5e6){ toast("Choose an image under 1.5 MB."); return; } const rd=new FileReader(); rd.onload=()=>{ T().logo=rd.result; log("Logo updated."); render(); toast("Logo updated."); }; rd.readAsDataURL(file); }
  if (e.target.id==="brandCustom"){ T().brand=e.target.value; log(`Brand colour changed to ${e.target.value}.`); render(); }
});
document.addEventListener("keydown", e => { if (e.key==="Escape" && S.modal) closeModal(); });
render();
</script>
